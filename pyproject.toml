[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucas-lab-sniffer"
version = "1.0.0"
description = "实验 1A：Windows GUI 网络嗅探器"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials", "scapy", "lark", "psutil", "pefile"]

[project.scripts]
lab-sniffer = "labsniffer.gui:main"

[tool.setuptools.packages.find]
include = ["labsniffer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: 本机真实网络及 Windows API", "gui: Qt 真实事件循环", "wireshark: TShark 插件交叉验证"]
